name: Check production configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check environment contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      COMMUNITY_ID: ${{ vars.COMMUNITY_ID }}
      TWITCH_BROADCASTER_USER_ID: ${{ vars.TWITCH_BROADCASTER_USER_ID }}
      TWITCH_BOT_USER_ID: ${{ vars.TWITCH_BOT_USER_ID }}
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
      DISCORD_REQUEST_CHANNEL_ID: ${{ vars.DISCORD_REQUEST_CHANNEL_ID }}
      DISCORD_STAFF_CHANNEL_ID: ${{ vars.DISCORD_STAFF_CHANNEL_ID }}
      DISCORD_VOLUNTEER_ROLE_ID: ${{ vars.DISCORD_VOLUNTEER_ROLE_ID }}
      DISCORD_STREAMER_USER_ID: ${{ vars.DISCORD_STREAMER_USER_ID }}
      RECIPIENT_LIMIT: ${{ vars.RECIPIENT_LIMIT }}
      ATTEMPT_LIMIT: ${{ vars.ATTEMPT_LIMIT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_EVENTSUB_SECRET: ${{ secrets.TWITCH_EVENTSUB_SECRET }}
      SPIKE_DIAGNOSTICS_TOKEN: ${{ secrets.SPIKE_DIAGNOSTICS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Check environment contract
        run: node scripts/deployment/check-production-environment.mjs
      - name: Render deployment configuration
        run: node scripts/render-github-wrangler.mjs
