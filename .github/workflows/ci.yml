name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Verify release candidate
        run: npm run verify
        env:
          VITEST_COVERAGE: ${{ env.SONAR_ENABLED }}
      - name: Analyze with SonarQube Cloud
        if: env.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Run fully local D1 benchmark
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: npm run benchmark:d1
      - name: Upload benchmark evidence
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-evidence
          path: |
            reports/d1-user-facing-benchmark.json
            reports/d1-user-facing-benchmark.md
            reports/d1-optimization-comparison.md
          if-no-files-found: error
