name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify selected commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install runtime binaries
        run: npm run install:runtime-binaries
      - name: Verify source
        run: npm run verify
      - name: Verify fully local D1 cost contract
        run: npm run benchmark:d1

  deploy:
    name: Deploy and verify
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.WORKER_BASE_URL }}
    env:
      COMMUNITY_ID: ${{ vars.COMMUNITY_ID }}
      TWITCH_BROADCASTER_USER_ID: ${{ vars.TWITCH_BROADCASTER_USER_ID }}
      TWITCH_BOT_USER_ID: ${{ vars.TWITCH_BOT_USER_ID }}
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
      DISCORD_REQUEST_CHANNEL_ID: ${{ vars.DISCORD_REQUEST_CHANNEL_ID }}
      DISCORD_STAFF_CHANNEL_ID: ${{ vars.DISCORD_STAFF_CHANNEL_ID }}
      DISCORD_VOLUNTEER_ROLE_ID: ${{ vars.DISCORD_VOLUNTEER_ROLE_ID }}
      DISCORD_STREAMER_USER_ID: ${{ vars.DISCORD_STREAMER_USER_ID }}
      RECIPIENT_LIMIT: ${{ vars.RECIPIENT_LIMIT }}
      ATTEMPT_LIMIT: ${{ vars.ATTEMPT_LIMIT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm
        run: npm install --global --ignore-scripts npm@12.0.2
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install runtime binaries
        run: npm run install:runtime-binaries
      - name: Record deployment start
        run: echo "DEPLOYMENT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Validate deployment configuration
        run: npm run check:community
      - name: Render Wrangler configuration
        run: node scripts/render-github-wrangler.mjs
      - name: Generate Twitch app token
        run: node scripts/deployment/create-twitch-app-token.mjs
        env:
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Record D1 recovery bookmark
        run: |
          mkdir -p .artifacts
          ./node_modules/.bin/wrangler d1 time-travel info "$D1_DATABASE_NAME" --json --config config/wrangler.github.jsonc > .artifacts/d1-bookmark.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply pending D1 migrations
        run: ./node_modules/.bin/wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config config/wrangler.github.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: deploy --config config/wrangler.github.jsonc
      - name: Upload Worker secrets
        run: node scripts/deployment/render-worker-secrets.mjs | ./node_modules/.bin/wrangler secret bulk --config config/wrangler.github.jsonc --name "$WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SPIKE_DIAGNOSTICS_TOKEN: ${{ secrets.SPIKE_DIAGNOSTICS_TOKEN }}
          TWITCH_EVENTSUB_SECRET: ${{ secrets.TWITCH_EVENTSUB_SECRET }}
      - name: Wait for Worker readiness
        run: node scripts/deployment/wait-for-worker.mjs
        env:
          SPIKE_DIAGNOSTICS_TOKEN: ${{ secrets.SPIKE_DIAGNOSTICS_TOKEN }}
      - name: Repair legacy unassigned requests
        run: node scripts/deployment/repair-legacy-requests.mjs
        env:
          SPIKE_DIAGNOSTICS_TOKEN: ${{ secrets.SPIKE_DIAGNOSTICS_TOKEN }}
      - name: Configure Discord commands and endpoint
        run: npm run discord:configure > .artifacts/discord-configuration.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Validate Discord resources
        run: npm run discord:validate > .artifacts/discord-validation.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Ensure Twitch EventSub subscription
        run: npm run twitch:subscribe > .artifacts/twitch-subscription.json
        env:
          TWITCH_EVENTSUB_SECRET: ${{ secrets.TWITCH_EVENTSUB_SECRET }}
      - name: Verify deployed service
        run: node scripts/deployment/verify-deployment.mjs
        env:
          SPIKE_DIAGNOSTICS_TOKEN: ${{ secrets.SPIKE_DIAGNOSTICS_TOKEN }}
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ github.sha }}
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
