version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      development-dependencies:
        dependency-type: development
    # The current Cloudflare test pool requires Vitest 4.1.x.
    # Remove these limits when the test integration supports Vitest 5.
    ignore:
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-istanbul"
        versions: [">=5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
